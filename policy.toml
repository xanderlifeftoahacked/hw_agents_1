workspace = "workspace"
state_dir = ".agent"

[commands]
allow = [
    "python3 -m unittest",
    "python3 -m unittest -v",
    "python3 -m unittest -v test_order",
    "ls",
    "ls -la",
    "pwd",
]
deny = [
    "rm",
    "bash",
    "sh",
    "python3 -c",
    "curl",
    "wget",
    "sudo",
    "git push",
]

[directories]
allow = ["workspace"]
deny = ["workspace/private"]

[files]
read_only = ["workspace/test_order.py"]

[journal]
generated = ["__pycache__", "*.pyc"]

[bash]
timeout_seconds = 30
max_output_bytes = 20000
sandbox = "bwrap"

[budget]
model_requests = 40
tool_calls = 80
side_effects = 25
result_bytes = 200000
